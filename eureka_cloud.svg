<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260">
<defs>
  <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.55" stop-color="#fbf9ff"/>
    <stop offset="1" stop-color="#e9e6fb"/>
